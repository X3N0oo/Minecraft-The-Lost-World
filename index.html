<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft: The Lost World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#081411;--panel:#13261e;--line:#365745;--lime:#a8df72;--text:#edf4e7;--muted:#afc1b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 30px}header{height:79px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a493b}header strong{font-size:14px;letter-spacing:2px}header nav{display:flex;gap:23px;align-items:center}header button,header a{background:none;border:0;color:#cfddcf;font-size:13px;text-decoration:none}header button:hover,header a:hover{color:var(--lime)}.logo{display:inline-block;width:21px;height:21px;background:linear-gradient(135deg,#9ed46e 50%,#3d6838 50%);vertical-align:middle;margin-right:10px;box-shadow:3px 3px #1e3c25}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.05em}h1{font-size:clamp(44px,6.5vw,92px);line-height:1.02;margin:20px 0}h2{font-size:46px;line-height:1.1;margin:15px 0}p{line-height:1.85}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--lime);font-weight:700;text-transform:uppercase}.btn{padding:16px 22px;border:1px solid #a5cf83;background:var(--lime);color:#142319;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;box-shadow:5px 5px #020a06}.btn:hover{background:#c2f69e}.btn.alt{background:#14281e;color:#eaf4e6;border-color:#739b78}.hero{position:relative;overflow:hidden;min-height:650px;background:radial-gradient(ellipse at 75% 17%,#6d7253,#26443c 35%,#0b231c 70%)}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#07140ff5 5%,#07140fc4 45%,#07140f29 100%);z-index:2}.pixels{position:absolute;bottom:0;left:0;right:0;height:76%;background:linear-gradient(0deg,#092016,#143b2d);clip-path:polygon(0 45%,8% 45%,8% 29%,17% 29%,17% 48%,29% 48%,29% 35%,42% 35%,42% 47%,54% 47%,54% 22%,63% 22%,63% 39%,74% 39%,74% 17%,83% 17%,83% 33%,92% 33%,92% 44%,100% 44%,100% 100%,0 100%)}.temple{position:absolute;right:12%;bottom:13%;width:220px;height:260px;background:repeating-linear-gradient(0deg,#4d7255 0 35px,#2d4a3a 35px 40px);border:20px solid #395840;border-top:35px solid #557a58;box-shadow:0 0 0 18px #314e3b,0 0 0 35px #223e32}.temple:after{content:'';position:absolute;bottom:-20px;left:60px;width:55px;height:110px;background:#0b160e;box-shadow:inset 0 0 30px #c1843b}.hero .wrap{position:relative;z-index:3;padding-top:105px;padding-bottom:110px}.hero h1{max-width:800px;text-transform:uppercase}.hero h1 span{color:var(--lime)}.hero p{max-width:540px;color:#d3e0d5}.hero .buttons{margin-top:30px}.buttons{display:flex;flex-wrap:wrap;gap:14px}.statline{display:flex;justify-content:space-between;padding:20px 0;font-size:12px;letter-spacing:2px;color:#a5b8a8;text-transform:uppercase;border-top:1px solid #3b5545}.section{padding:80px 0}.intro{color:var(--muted);max-width:700px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}.card{background:linear-gradient(145deg,#1b3428,#10221c);padding:30px;border:1px solid var(--line);min-height:210px}.card b{color:var(--lime);letter-spacing:2px;font-size:12px}.card h3{font-size:26px;margin:35px 0 10px}.card p{color:var(--muted);font-size:14px;margin:0}.game{padding:70px 0 90px;min-height:70vh;background:radial-gradient(ellipse at 80% 0,#294a3738,transparent 50%)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px}.chapter{color:var(--lime);font-weight:700;letter-spacing:3px;font-size:12px;text-transform:uppercase}.story{padding:37px 42px;background:#10231c;border:1px solid var(--line);box-shadow:8px 8px #030b07}.story p{color:#d4e0d5;font-size:16px;margin:0 0 18px}.story strong{color:#f5c986}.prompt{font-size:21px;font-weight:700;margin:32px 0 18px}.choice{display:flex;align-items:center;justify-content:space-between;width:100%;padding:19px 22px;margin:12px 0;text-align:left;color:#eaf4e5;background:#1b3628;border:1px solid #598364;font-weight:700}.choice:hover{background:#31583c;transform:translateX(3px)}.choice i{color:var(--lime);font-size:23px;font-style:normal}.side{background:#11231c;border:1px solid var(--line);padding:25px;height:max-content}.side h3{font-size:18px;margin:0 0 10px}.side p,.side li{font-size:13px;color:var(--muted)}.side ul{padding-left:20px}.ending{display:inline-block;border:1px solid #8a7750;color:#e7c183;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:20px}.form{max-width:700px;padding:32px;background:var(--panel);border:1px solid var(--line);margin:30px auto}.form label{display:block;margin:22px 0 10px;font-weight:700}.form select,.form textarea{width:100%;padding:14px;background:#081711;color:white;border:1px solid #57735d}.form textarea{min-height:130px}.fine{font-size:12px;color:#9ab49d}.footer{padding:28px 0;border-top:1px solid #365342;font-size:12px;color:#8fa696;display:flex;justify-content:space-between;gap:15px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.temple{opacity:.4;right:-60px}.hero .wrap{padding-top:80px}header nav{gap:10px}header nav a:nth-child(1),header nav a:nth-child(2){display:none}}
@media(max-width:550px){.wrap{padding:0 18px}.story{padding:25px}.hero h1{font-size:54px}.footer{flex-direction:column}.statline{font-size:9px}}
</style></head><body>
